# Standalone workspace of the open Geometer verifier. Generated by the export from the Geometer monorepo.
[workspace]
resolver = "3"
members = ["crates/geo-contracts", "crates/geo-verify", "tools/contractgen"]

[workspace.package]
repository = "https://github.com/GeometerLabs/geometer-verify"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
